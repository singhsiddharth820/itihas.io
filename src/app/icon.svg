<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Outer Ring / Dark Dial -->
  <circle cx="16" cy="16" r="15" fill="#0d0f17" stroke="#f59e0b" stroke-width="2" />

  <!-- Inner Dashed Track -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Center Hub -->
  <circle cx="16" cy="16" r="3" fill="#f59e0b" />

  <!-- Cardinal Spokes (Kālachakra Wheel) -->
  <line x1="16" y1="5" x2="16" y2="13" stroke="#fbbf24" stroke-width="1.5" />
  <line x1="16" y1="19" x2="16" y2="27" stroke="#fbbf24" stroke-width="1.5" />
  <line x1="5" y1="16" x2="13" y2="16" stroke="#fbbf24" stroke-width="1.5" />
  <line x1="19" y1="16" x2="27" y2="16" stroke="#fbbf24" stroke-width="1.5" />

  <!-- Diagonal Spokes -->
  <line x1="8.2" y1="8.2" x2="13.8" y2="13.8" stroke="#f59e0b" stroke-width="1" />
  <line x1="18.2" y1="18.2" x2="23.8" y2="23.8" stroke="#f59e0b" stroke-width="1" />
  <line x1="23.8" y1="8.2" x2="18.2" y2="13.8" stroke="#f59e0b" stroke-width="1" />
  <line x1="13.8" y1="18.2" x2="8.2" y2="23.8" stroke="#f59e0b" stroke-width="1" />
</svg>